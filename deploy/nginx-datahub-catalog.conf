# /etc/nginx/sites-available/datahub-catalog
# Serves the built UI and forwards app APIs + Databricks proxy to the Node service.
server {
    listen 80;
    server_name _;   # replace with your hostname

    root /var/www/datahub-catalog;
    index index.html;

    # Keep the catalog out of search engines (belt and braces: header + robots.txt + meta tag in index.html)
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    location = /robots.txt {
        add_header Content-Type text/plain;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Static UI (v1.54): security headers for the files nginx serves itself. The Node service sets the same headers
    # on every API response (server/security.js) — keep the CSP here identical to server/security.js when you change
    # it. nginx add_header is not inherited into a location that has its own add_header, hence the repetition above.
    location / {
        try_files $uri /index.html;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # With TLS (certbot) enable HSTS as well — only once https works for every host name of this server:
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Long requests (v1.51/1.52/1.55): CSV import upload, dump export/restore, streamed CSV/OKF exports, source inspection
    # (Power BI scans can take minutes) — regex locations
    # match in order, so this block stays above the general one; raise IMPORT_MAX_BYTES in the unit when needed
    location ~ ^/(api/import/(csv|bundle)|api/export/(csv|okf)|api/source-import/inspect|admin/dump)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 512m;
    }

    # App server: auth, user management, shared catalog, dumps, Databricks proxy
    location ~ ^/(auth|api|admin|mcp|oauth|\.well-known|healthz)(/|$) {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        client_max_body_size 25m;
    }


    gzip on;
    gzip_types text/css application/javascript application/json;
}
