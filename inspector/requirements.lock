# Pinned install set of the source inspector (v1.73, F-I7) — requirements.txt keeps the lower bounds, this file is
# what deployments and CI install:
#   /opt/datahub-catalog/inspector/venv/bin/pip install -r /opt/datahub-catalog/inspector/requirements.lock
# Resolved from requirements.txt with `pip install --dry-run --report` for CPython 3.11 and 3.12 on manylinux x86_64
# (identical sets), choosing the newest release that was at least two weeks old on 2026-10-23 — which keeps
# duckdb on 1.5.x (2.0.0 is two days old) and SQLAlchemy on 2.0.x (2.1 is a new minor line; 2.0.55 is a week old).
# Transitive dependencies are pinned as well. Not pinned here: the optional dialects / JDBC bridge in
# requirements-optional.txt (installed per site, versions depend on the database server and the JVM).
# To refresh: bump requirements.txt if needed, re-resolve, run `npm run test:inspector` with the new set installed.

